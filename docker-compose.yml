services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: finance
    ports:
      - "5432:5432"
    volumes:
      - finance-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://finance:finance@postgres:5432/finance
      CORS_ORIGINS: http://localhost:3000
      OPERATIONS_CORE_DIR: /app/operations
      OPERATIONS_MANAGED_DIR: /app/managed-operations
    volumes:
      # Production instances should mount the same read-only shared directory.
      # Ops publishes with an atomic rename; the API only watches and reads it.
      - ./backend/managed-operations:/app/managed-operations:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
        # Baked in at build time: the browser needs the client id to render
        # Google's button, and the server verifies what it sends back. Invoke
        # Compose with `--env-file backend/.env` so interpolation sees it;
        # service-level `env_file` is applied too late for build arguments.
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  finance-postgres:
