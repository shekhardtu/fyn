<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>fyn — offline</title>
  <style>
    :root {
      --ground: #fafafb; --surface: #ffffff; --ink: #101116; --ink-body: #3c4048;
      --ink-muted: #6c727c; --line: #e5e7ec; --secondary: #4340e0; --on-secondary: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ground: #101116; --surface: #17181e; --ink: #f0f1f5; --ink-body: #c6cad2;
        --ink-muted: #8d939e; --line: #272931; --secondary: #8b89ff; --on-secondary: #17181e;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center;
      background: var(--ground); color: var(--ink-body);
      font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, sans-serif;
      padding: 1.5rem;
    }
    main {
      max-width: 22rem; text-align: center; background: var(--surface);
      border: 1px solid var(--line); border-radius: 12px; padding: 2rem 1.75rem;
    }
    .mark {
      width: 44px; height: 44px; border-radius: 12px; margin: 0 auto 1rem;
      display: grid; place-items: center; background: var(--secondary);
      color: var(--on-secondary); font-size: 22px; font-weight: 600;
    }
    h1 { margin: 0; font-size: 1.1875rem; color: var(--ink); }
    p { margin: 0.5rem 0 0; font-size: 0.875rem; color: var(--ink-muted); }
    button {
      margin-top: 1.25rem; height: 2.25rem; padding: 0 1rem; border: 0;
      border-radius: 8px; background: var(--secondary); color: var(--on-secondary);
      font: inherit; font-size: 0.875rem; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">₹</div>
    <h1>You're offline</h1>
    <p>fyn needs a connection to reach your financial data. Nothing was lost — reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
