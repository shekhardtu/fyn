[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fyn-ai-api"
version = "0.1.0"
description = "Deterministic domain backend for fyn AI"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.12,<1",
  "agno>=1.7,<3",
  "ag-ui-protocol==0.1.19",
  "openai>=1.68,<3",
  # One-time-code delivery to MSG91 and Postmark.
  "httpx>=0.27,<1",
  # Verifies Google ID tokens against Google's published keys, with the key
  # rotation and audience checks that make the credential mean anything.
  "google-auth>=2.35,<3",
  "requests>=2.32,<3",
  # Human-authored operation manifests, strict input validation, and runtime
  # catalog reloads. These are explicit dependencies rather than relying on
  # uvicorn's optional dependency tree.
  "PyYAML>=6.0,<7",
  "jsonschema>=4.23,<5",
  "watchfiles>=1.0,<2",
  # Centralized natural-language date resolution with an explicit relative
  # base and timezone; finance-specific month policies remain in our adapter.
  "dateparser>=1.2,<2",
  # AST-level validation of model-authored SQL in the governed lane: parse,
  # qualify against the source manifest, transpile per dialect. Never regex.
  "sqlglot>=30,<31",
  "eval-type-backport>=0.2,<1; python_version < '3.10'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.16,<1",
  "mypy>=1.19,<2",
  "types-dateparser>=1.2,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
# Not a style gate. `F` is pyflakes — undefined names, unused imports,
# redefinitions — and `E9` is code that will not run at all. Every one is a
# real defect rather than a preference, which is what makes this safe to
# enforce on a codebase this size without a reformatting commit first.
line-length = 200

[tool.ruff.lint]
select = ["F", "E9"]

[tool.mypy]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

# A ratchet, not a blanket exemption. 54 of 84 modules type-check clean today
# and are enforced; the 30 below do not and are listed one by one so the
# list can only shrink deliberately. A new module is checked by default, which
# is the point: new code cannot join the backlog by accident.
#
# Progress: `mypy app` passes. To take one off the list, delete its line and
# fix what appears.
[[tool.mypy.overrides]]
module = [
  "app.contracts",
  "app.operations.catalog",
  "app.security",
  "app.services.adapters",
  "app.services.agent_tools",
  "app.services.agents",
  "app.services.agui",
  "app.services.analysis_harness",
]
ignore_errors = true
