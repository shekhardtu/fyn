[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fyn-ai-api"
version = "0.1.0"
description = "Deterministic domain backend for fyn AI"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.12,<1",
  "agno>=1.7,<3",
  "ag-ui-protocol==0.1.19",
  "openai>=1.68,<3",
  # One-time-code delivery to MSG91 and Postmark.
  "httpx>=0.27,<1",
  # Verifies Google ID tokens against Google's published keys, with the key
  # rotation and audience checks that make the credential mean anything.
  "google-auth>=2.35,<3",
  "requests>=2.32,<3",
  "eval-type-backport>=0.2,<1; python_version < '3.10'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
