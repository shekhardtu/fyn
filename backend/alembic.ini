[alembic]
script_location = alembic
prepend_sys_path = .
# Alembic 1.16 warns without this, falling back to splitting paths on spaces,
# commas and colons. "os" means the platform separator and nothing else.
path_separator = os
sqlalchemy.url = postgresql+psycopg://finance:finance@localhost:5432/finance

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

